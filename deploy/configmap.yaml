apiVersion: v1
kind: ConfigMap
metadata: { name: navidrome-config }
data:
  ND_ADDRESS: 0.0.0.0
  ND_DATAFOLDER: /data
  ND_IMAGECACHESIZE: 500MB
  ND_LOGLEVEL: info
  ND_MUSICFOLDER: s3://music
  ND_PORT: "4533"
  # Garage HA endpoint: HAProxy DaemonSet (garage-proxy) on the control-plane nodes,
  # health-checking each Garage node — never a node IP (a node IP is a SPOF, cf. the
  # 2026-07-27 NAS outage that took streaming down). Off-cluster/DR consumers use a node IP.
  ND_S3_ENDPOINT: http://garage.garage.svc.cluster.local:3900
  ND_S3_PATHSTYLE: "true"
  ND_S3_REGION: garage
  # NOT `ND_SCANSCHEDULE`. The config key is `scanner.schedule`, and viper resolves it as
  # ND_ + key with '.' -> '_' (conf/configuration.go: SetEnvPrefix("ND") + SetEnvKeyReplacer),
  # so the env var is ND_SCANNER_SCHEDULE. There is no back-compat alias for the old name:
  # it is silently ignored, `scanner.schedule` keeps its "0" default, validateScanSchedule()
  # normalises "0" -> "", and schedulePeriodicScan() (cmd/root.go) logs
  # "Periodic scan is DISABLED" and returns.
  #
  # So prod ran with NO periodic scan for as long as this file has existed. That is what
  # made the 2026-10-22 Garage outage expensive. The 00:21Z startup scan hit `connection
  # refused` on the endpoint above (Garage was down 00:18-00:22Z: mauler-vm's zone went with
  # the Hyper-V host that was restarted, and r2d2 was already dead, so 2 of 3 zones were
  # gone), bailed with "Scanner: Duplicate DirEntry failure", and recorded the library as
  # scanned-and-empty. Nothing re-scanned it for 2d23h. Recovery came from a rollout restart
  # at 2026-10-24 23:54:34Z: that pod's startup scan imported all 8,697 tracks by 23:59:07Z,
  # but albums and artists still did not list (the library row carried total_songs=0 /
  # total_albums=0), and it was a manual `navidrome scan --full` finishing at 00:06:52Z that
  # made the library listable. With `0 4 * * *` live, the 04:00Z scan would have healed it
  # inside ~4h on its own.
  #
  # What the alerting actually did, read off ALERTS with alertstate preserved. An earlier
  # version of this note got this wrong twice, so verify rather than repeat it:
  #   GarageSurvivorUnavailable     FIRED 00:22-00:23Z, two samples. Critical, on the
  #                                   NEVER_SILENCE list: the only alert that paged anyone
  #                                   about the zone loss, and it self-cleared on recovery.
  #   GarageQuorumLost              pending 00:19-00:22Z, NEVER fired (`for: 5m` > 4-min gap)
  #   GarageSurvivingZoneScrapeDown pending 00:19-00:22Z, NEVER fired (same)
  #   GarageClusterUnhealthy        firing 24/7 (r2d2 dark since 2026-07-27), SILENCED
  #   GaragePartitionsDegraded      firing 24/7, SILENCED
  #   MusicChecksStale              pending 01:01Z, firing 01:16Z -> 2026-10-25 00:00Z
  #                                   (~71h), unsilenced, Discord, 24h repeat, unremediated
  # The silences live in dubnubdubnub/infra monitoring/silences.yaml and match
  # GarageClusterUnhealthy / GaragePartitionsDegraded for zone=blhx370 AND zone=mauler-vm,
  # i.e. both survivors, so those two could never have notified anybody.
  #
  # Two separate open items follow, and neither is "add another rule": the 71-hour
  # MusicChecksStale tail was a response failure on an alert that behaved correctly, and the
  # rules actually written to name a zone loss cannot fire under 5 minutes -- the only thing
  # that can is a ~2-minute critical that clears itself.
  #
  # A configmap change alone does not restart this pod; see the revision annotation in
  # deployment.yaml.
  ND_SCANNER_SCHEDULE: 0 4 * * *
