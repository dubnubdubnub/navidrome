apiVersion: v1
kind: ConfigMap
metadata: { name: navidrome-config }
data:
  ND_ADDRESS: 0.0.0.0
  ND_DATAFOLDER: /data
  ND_IMAGECACHESIZE: 500MB
  ND_LOGLEVEL: info
  ND_MUSICFOLDER: s3://music
  ND_PORT: "4533"
  # Garage HA endpoint: HAProxy DaemonSet (garage-proxy) on the control-plane nodes,
  # health-checking each Garage node — never a node IP (a node IP is a SPOF, cf. the
  # 2026-07-27 NAS outage that took streaming down). Off-cluster/DR consumers use a node IP.
  ND_S3_ENDPOINT: http://garage.garage.svc.cluster.local:3900
  ND_S3_PATHSTYLE: "true"
  ND_S3_REGION: garage
  # NOT `ND_SCANSCHEDULE`. The config key is `scanner.schedule`, and viper resolves it as
  # ND_ + key with '.' -> '_' (conf/configuration.go: SetEnvPrefix("ND") + SetEnvKeyReplacer),
  # so the env var is ND_SCANNER_SCHEDULE. There is no back-compat alias for the old name:
  # it is silently ignored, `scanner.schedule` keeps its "0" default, validateScanSchedule()
  # normalises "0" -> "", and schedulePeriodicScan() (cmd/root.go) logs
  # "Periodic scan is DISABLED" and returns.
  #
  # So prod ran with NO periodic scan for as long as this file has existed. That is what
  # made the 2026-10-22 Garage blip expensive. The 00:21Z startup scan hit `connection
  # refused` on the endpoint above (Garage was down 00:18-00:22Z: mauler-vm's zone went
  # with the Hyper-V host that was restarted, and r2d2 was already dead, so 2 of 3 zones
  # were gone), bailed with "Scanner: Duplicate DirEntry failure", and recorded the
  # library as scanned-and-empty. With `0 4 * * *` live, the 04:00Z scan would have
  # healed it inside ~4h. Instead the Subsonic API served an empty library for 2d23h
  # (2026-10-22 00:21Z -> 2026-10-24 23:54Z), until a manual `navidrome scan --full`
  # re-indexed the 8,697 tracks that were in the bucket the whole time.
  #
  # Detection was NOT the gap, so do not go looking for a missing alert: GarageQuorumLost,
  # GarageSurvivingZoneScrapeDown, GarageClusterUnhealthy and GaragePartitionsDegraded all
  # fired at 00:20-00:25Z, and MusicChecksStale fired for all 283 samples of the 3-day
  # window. It is severity=warning and nobody acted on it. The open problem is response,
  # not coverage -- see monitoring/rules/synthetic-checks-rules.yaml in dubnubdubnub/infra.
  #
  # A configmap change alone does not restart this pod; see the revision annotation in
  # deployment.yaml.
  ND_SCANNER_SCHEDULE: 0 4 * * *
