apiVersion: v1
kind: ConfigMap
metadata: { name: navidrome-config }
data:
  ND_ADDRESS: 0.0.0.0
  ND_DATAFOLDER: /data
  ND_IMAGECACHESIZE: 500MB
  ND_LOGLEVEL: info
  ND_MUSICFOLDER: s3://music
  ND_PORT: "4533"
  # Garage HA endpoint: HAProxy DaemonSet (garage-proxy) on the control-plane nodes,
  # health-checking each Garage node — never a node IP (a node IP is a SPOF, cf. the
  # 2026-07-27 NAS outage that took streaming down). Off-cluster/DR consumers use a node IP.
  ND_S3_ENDPOINT: http://garage.garage.svc.cluster.local:3900
  ND_S3_PATHSTYLE: "true"
  ND_S3_REGION: garage
  # NOT `ND_SCANSCHEDULE`. The config key is `scanner.schedule`, and viper resolves it as
  # ND_ + key with '.' -> '_' (conf/configuration.go: SetEnvPrefix("ND") + SetEnvKeyReplacer),
  # so the env var is ND_SCANNER_SCHEDULE. There is no back-compat alias for the old name:
  # it is silently ignored, `scanner.schedule` keeps its "0" default, validateScanSchedule()
  # normalises "0" -> "", and schedulePeriodicScan() (cmd/root.go) logs
  # "Periodic scan is DISABLED" and returns.
  #
  # So prod ran with NO periodic scan for as long as this file has existed. That is what
  # made the 2026-10-22 Garage outage expensive. The 00:21Z startup scan hit `connection
  # refused` on the endpoint above (Garage was down 00:18-00:22Z: mauler-vm's zone went with
  # the Hyper-V host restarted from the Start Menu, and r2d2 was already dead, so only
  # blhx370 survived), bailed with "Scanner: Duplicate DirEntry failure", and recorded the
  # library as scanned-and-empty. Nothing re-scanned it for 2d23h.
  #
  # Recovery, in the order the evidence puts it:
  #   2026-10-24 23:54:34Z  rollout restart
  #   23:54:40 -> 23:59:07Z  that pod's startup scan (fullScan=false) imported all 8,697
  #                          tracks (per-folder tracksImported sums to 8697)
  #   2026-10-25 00:00:19Z   checks-music passed -- getRandomSongs plus a raw and an opus
  #                          stream, both ffprobe-decoded. Song-level content and Garage
  #                          streaming were healthy 72s after the startup scan finished, and
  #                          this is what cleared MusicChecksStale.
  #   00:06:52Z              a manual `navidrome scan --full` finished; browsing worked
  #                          afterwards.
  # Attribution of "browsing came back" is UNRESOLVED and this note no longer assigns it. The
  # operator saw getArtists count 0 / getAlbumList2 empty / library row total_songs=0 after the
  # startup scan, but the deployed code refreshes artist and library stats at the end of EVERY
  # scan that detects changes -- scanner/scanner.go runs runRefreshStats and runUpdateLibraries
  # in the same final step regardless of fullScan, and RefreshStats(false) selects artists with
  # updated_at > the previous last_scan_at, so the 23:59:07Z startup scan covered them. The
  # observation is also undated, and the supported reading is that it was taken DURING the
  # 4m27s startup scan, not after it: every getArtists error-70 response from that client falls
  # between 23:54:46Z and 23:56:36Z, inside the scan window. What is not in doubt: song-level
  # serving was healthy at 00:00:19Z, and `0 4 * * *` -- which is also a non-full scan,
  # cmd/root.go:156 schedulerInstance.Add(schedule, func(){ s.ScanAll(ctx,false) }) -- does the same aggregation, so a periodic
  # scan would have restored both serving and browsing unattended inside ~4h.
  #
  # What the alerting did, for the 00:18-00:22Z zone loss. Four earlier drafts of this note
  # were wrong, twice about which alerts fired; re-derive rather than trusting any of it.
  # Fired, unsilenced, both critical, both self-clearing on recovery:
  #   GarageSurvivorUnavailable      for=1m  pending 00:21, firing 00:22-00:23Z (2 samples)
  #   ExternalTargetDown{10.1.1.11:9199} for=2m  pending 00:20-00:21, firing 00:22-00:23Z
  # Did not fire:
  #   GarageQuorumLost               for=5m  pending 00:19-00:22Z only
  #   GarageSurvivingZoneScrapeDown  for=5m  pending 00:19-00:22Z only
  # Fired but irrelevant -- 24/7 since r2d2 died and silenced for zone=blhx370 AND
  # zone=mauler-vm in dubnubdubnub/infra monitoring/silences.yaml, so they cannot notify
  # anybody; generic TargetDown{job="garage"} is silenced too:
  #   GarageClusterUnhealthy         for=5m      GaragePartitionsDegraded  for=1h
  # The narrow real gap, stated precisely: the rules that describe Garage quorum or partition
  # state need 5m-1h, so a sub-5-minute zone loss surfaces only as node- and survivor-level
  # alerts that clear themselves as soon as the zone returns -- here the two criticals above
  # plus FleetNodeStale{node="mauler"} (warning, no `for:`, firing 00:22-00:24Z to Discord on
  # the default route). Nothing leaves a durable IN-CLUSTER notification record: Alertmanager
  # keeps no archive of resolved alerts, so once the ALERTS series age out of the 15d retention
  # window nothing in the cluster shows that anyone was told. Outside it, the discord receiver
  # has send_resolved: true, so the firing and resolved posts for these alerts are still in the
  # Discord channel. The raw signals do survive -- up-bits,
  # ALERTS pending and firing, the kube_pod_status_ready flip, and the guest's hv_utils line
  # in the Loki journal -- which is exactly how this paragraph was re-derived five times.
  #
  # The three-day tail was a different failure and the one that hurt: MusicChecksStale
  # (severity=warning, for=15m, unsilenced, Discord on a 24h repeat) went pending 01:01Z and
  # fired from 01:16Z until the 2026-10-25 00:00:19Z pass -- about 71h. It behaved perfectly
  # and nobody acted. That is a response failure, not a rule gap.
  #
  # Re-deriving this: query ALERTS with alertstate preserved on prometheus-0. Both replicas
  # hold ALERTS series for the window, but prometheus-1 runs on mauler-vm and its container
  # restarted at 00:22:43Z, and the two zone-loss alerts above appear only on prometheus-0.
  #
  # A configmap change alone does not restart this pod; see the revision annotation in
  # deployment.yaml.
  ND_SCANNER_SCHEDULE: 0 4 * * *
