apiVersion: apps/v1
kind: Deployment
metadata: { name: navidrome }
spec:
  replicas: 1
  selector: { matchLabels: { app: navidrome } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: navidrome }
      annotations:
        # Bump this whenever deploy/configmap.yaml changes.
        #
        # Argo CD deploys this app with `selfHeal: true`, and the pod reads every
        # setting through `envFrom: configMapRef: navidrome-config`. Editing the
        # ConfigMap does not change this pod template, so Argo syncs the ConfigMap and
        # leaves the running pod untouched -- the new settings never take effect. The
        # reflex manual fix, `kubectl rollout restart deployment/navidrome`, is worse:
        # the `restartedAt` annotation is a live edit to a Git-owned field, so selfHeal
        # reverts it and rolls the pod back to the OLD environment.
        #
        # The rollout therefore has to be driven from Git. Changing this annotation
        # changes the pod template, which makes Argo itself perform the update.
        # `strategy: Recreate` means one brief downtime (1 replica, RWO PVC).
        #
        # 2 = ND_SCANSCHEDULE -> ND_SCANNER_SCHEDULE (PR #1, 2026-10-25). That key was
        # never read by this Navidrome version, so `Periodic scan is DISABLED` was logged
        # at every boot and the library only ever scanned on startup.
        config.navidrome.dubnubdubnub.com/revision: "2"
    spec:
      imagePullSecrets:
        - { name: ghcr-pull }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: NotIn, values: [mauler-vm, lima-m4air-vm] }
      containers:
        - name: navidrome
          image: ghcr.io/dubnubdubnub/navidrome-s3 # tag set by kustomize (CI write-back)
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4533 }]
          envFrom:
            - configMapRef: { name: navidrome-config }
          env:
            - { name: ND_S3_ACCESSKEY, valueFrom: { secretKeyRef: { name: music-s3, key: ACCESS_KEY } } }
            - { name: ND_S3_SECRETKEY, valueFrom: { secretKeyRef: { name: music-s3, key: SECRET_KEY } } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: navidrome-data }
