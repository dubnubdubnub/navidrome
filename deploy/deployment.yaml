apiVersion: apps/v1
kind: Deployment
metadata: { name: navidrome }
spec:
  replicas: 1
  selector: { matchLabels: { app: navidrome } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: navidrome }
      annotations:
        # Bump this whenever deploy/configmap.yaml changes.
        #
        # The pod reads every setting through `envFrom: configMapRef: navidrome-config`,
        # and envFrom is resolved when the pod is created. Editing the ConfigMap leaves
        # this pod template byte-identical, so Argo CD syncs the ConfigMap and never
        # restarts the pod: the new settings sit inert until something else happens to
        # recycle it, and there is no config reloader in the cluster to do it.
        #
        # `kubectl rollout restart` does work, and is NOT reverted -- verified 2026-10-25:
        # the `restartedAt` annotation it writes was still on the live pod template 17h
        # later with the app Synced/Healthy, selfHeal not treating that live-only
        # annotation as drift. It is still the wrong tool: it leaves the running pod
        # differing from anything in Git, and nobody can tell from the manifest when or
        # why a config change actually took effect.
        #
        # So drive the rollout from Git. Changing this annotation changes the pod
        # template, which makes Argo itself perform the update. `strategy: Recreate`
        # means one brief downtime (1 replica, RWO PVC; Longhorn re-attaches cross-node).
        #
        # 2 = ND_SCANSCHEDULE -> ND_SCANNER_SCHEDULE (PR #1, 2026-10-25). That key was
        # never read by this Navidrome version, so `Periodic scan is DISABLED` was logged
        # at every boot and the library only ever scanned on startup.
        # 3 = ND_ENABLEINSIGHTSCOLLECTOR=false (2026-10-28).
        config.navidrome.dubnubdubnub.com/revision: "3"
    spec:
      imagePullSecrets:
        - { name: ghcr-pull }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: NotIn, values: [mauler-vm, lima-m4air-vm] }
      containers:
        - name: navidrome
          image: ghcr.io/dubnubdubnub/navidrome-s3 # tag set by kustomize (CI write-back)
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4533 }]
          envFrom:
            - configMapRef: { name: navidrome-config }
          env:
            - { name: ND_S3_ACCESSKEY, valueFrom: { secretKeyRef: { name: music-s3, key: ACCESS_KEY } } }
            - { name: ND_S3_SECRETKEY, valueFrom: { secretKeyRef: { name: music-s3, key: SECRET_KEY } } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: navidrome-data }
