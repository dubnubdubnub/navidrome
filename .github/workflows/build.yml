name: build
on:
  push:
    branches: ["feat/s3-streaming"]
    paths-ignore: ["deploy/**"] # the write-back commit must not re-trigger the build
  # PRs into the deploy branch build (and, for same-repo PRs, push) a TEST image tagged
  # `test-<head sha>` so a change can be verified on the cluster before merge. A PR build
  # never writes back to deploy/ and never pushes a commit.
  pull_request:
    branches: ["feat/s3-streaming"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dubnubdubnub/navidrome-s3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the deploy/ tag write-back (push to feat/s3-streaming only)
      packages: write # to push to GHCR with the ephemeral GITHUB_TOKEN
    env:
      # Only a push to the deploy branch produces a deployable tag + write-back. Everything
      # else (PR, manual dispatch) gets a `test-` prefixed tag and no write-back.
      IS_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/s3-streaming' }}
      # Fork PRs get a read-only token: build to prove the Dockerfile, but don't push.
      CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the PR head itself (not the synthetic merge commit) so the test tag's
          # SHA names exactly the tree that was built.
          ref: ${{ env.SRC_SHA }}

      - name: Compute image tag
        id: tag
        run: |
          if [ "$IS_DEPLOY" = "true" ]; then
            echo "tag=${SRC_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test-${SRC_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: env.CAN_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.s3
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Report test image
        if: env.IS_DEPLOY != 'true' && env.CAN_PUSH == 'true'
        run: |
          echo "::notice::Test image pushed: ${IMAGE}:${{ steps.tag.outputs.tag }}"

      - name: Write image tag into deploy/ and commit back
        if: env.IS_DEPLOY == 'true'
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          (cd deploy && ../kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ github.sha }})
          git config user.name "ci-bot"
          git config user.email "ci@dubnubdubnub"
          git add deploy/kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }} [skip ci]" || { echo "no deploy change"; exit 0; }
          git push
