name: build
on:
  push:
    branches: ["feat/s3-streaming"]
    paths-ignore: ["deploy/**"] # the write-back commit must not re-trigger the build
  pull_request:
    branches: ["feat/s3-streaming"]
    paths-ignore: ["deploy/**"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dubnubdubnub/navidrome-s3

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Same package set and tags as upstream's pipeline.yml "Test Go code" job (which only
      # runs for PRs against master, so it never runs on this fork's branches).
      - name: Go tests
        run: go test -shuffle=on -tags netgo,sqlite_fts5 $(go list ./... | grep -v '/plugins$')

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI tests
        working-directory: ui
        run: |
          npm ci
          npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the deploy/ tag write-back (push to feat/s3-streaming only)
      packages: write # to push to GHCR with the ephemeral GITHUB_TOKEN
    env:
      # Only a build of feat/s3-streaming itself gets the bare-SHA tag that deploy/ pins. A PR
      # (or a dispatch on another branch) builds unreviewed code, so its image is published as
      # `test-<sha>` and can never be mistaken for, or collide with, a deployable tag.
      SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEPLOYABLE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/s3-streaming' }}
      # Push only from this repo: a PR from a fork gets a read-only token.
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the PR head itself, not the synthetic merge commit, so the tag's SHA names
          # exactly the tree inside the image.
          ref: ${{ env.SRC_SHA }}
          # The token is not left in .git/config for later steps (and the Docker build
          # context); the write-back step below authenticates its one push explicitly.
          persist-credentials: false

      - name: Compute image tag
        run: |
          if [ "$DEPLOYABLE" = "true" ]; then
            echo "TAG=${SRC_SHA}" >> "$GITHUB_ENV"
          else
            echo "TAG=test-${SRC_SHA}" >> "$GITHUB_ENV"
          fi

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.s3
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Write image tag into deploy/ and commit back
        # Only a push/dispatch build of feat/s3-streaming itself deploys; a PR build, or a dispatch
        # on another branch, just publishes the image.
        if: env.DEPLOYABLE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          (cd deploy && ../kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ github.sha }})
          git config user.name "ci-bot"
          git config user.email "ci@dubnubdubnub"
          git add deploy/kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }} [skip ci]" || { echo "no deploy change"; exit 0; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/feat/s3-streaming
