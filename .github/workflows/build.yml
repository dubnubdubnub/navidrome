name: build
on:
  push:
    branches: ["feat/s3-streaming"]
    paths-ignore: ["deploy/**"] # the write-back commit must not re-trigger the build
  pull_request:
    branches: ["feat/s3-streaming"]
    paths-ignore: ["deploy/**"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dubnubdubnub/navidrome-s3
  # Every job tests/builds the PR head itself (not GitHub's synthetic merge commit), so what
  # was tested is exactly what the image tag names.
  SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Same package set and tags as upstream's pipeline.yml "Test Go code" job (which only
      # runs for PRs against master, so it never runs on this fork's branches).
      - name: Go tests
        run: go test -shuffle=on -tags netgo,sqlite_fts5 $(go list ./... | grep -v '/plugins$')

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI tests
        working-directory: ui
        run: |
          npm ci
          npm test

  # The runner image has no ffmpeg, so in `test` every real-ffmpeg spec (including the
  # remote-input SSRF guard) is skipped. Prod runs Debian bookworm's ffmpeg (Dockerfile.s3's
  # runtime is debian:bookworm-slim + apt ffmpeg), so run the ffmpeg suite against exactly
  # that package. ND_TEST_REQUIRE_FFMPEG turns a missing binary into a failure, not a skip.
  ffmpeg-bookworm:
    runs-on: ubuntu-latest
    container: golang:1.27.3-bookworm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_SHA }}
          persist-credentials: false

      - name: Install bookworm ffmpeg (the package prod's image ships)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          dpkg-query -W ffmpeg

      - name: ffmpeg suite against bookworm ffmpeg
        env:
          ND_TEST_REQUIRE_FFMPEG: "1"
        run: go test -count=1 -tags netgo,sqlite_fts5 ./core/ffmpeg/ -ginkgo.v

  build:
    needs: [test, ffmpeg-bookworm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the deploy/ tag write-back (push to feat/s3-streaming only)
      packages: write # to push to GHCR with the ephemeral GITHUB_TOKEN
    env:
      # Only a build of feat/s3-streaming itself gets the bare-SHA tag that deploy/ pins. A PR
      # (or a dispatch on another branch) builds unreviewed code, so its image is published as
      # `test-<sha>` and can never be mistaken for, or collide with, a deployable tag.
      DEPLOYABLE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/s3-streaming' }}
      # Push only from this repo: a PR from a fork gets a read-only token.
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the PR head itself, not the synthetic merge commit, so the tag's SHA names
          # exactly the tree inside the image.
          ref: ${{ env.SRC_SHA }}
          # The token is not left in .git/config for later steps (and the Docker build
          # context); the write-back step below authenticates its one push explicitly.
          persist-credentials: false

      - name: Compute image tag
        run: |
          if [ "$DEPLOYABLE" = "true" ]; then
            echo "TAG=${SRC_SHA}" >> "$GITHUB_ENV"
          else
            echo "TAG=test-${SRC_SHA}" >> "$GITHUB_ENV"
          fi

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.s3
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Write image tag into deploy/ and commit back
        # Only a push/dispatch build of feat/s3-streaming itself deploys; a PR build, or a dispatch
        # on another branch, just publishes the image.
        if: env.DEPLOYABLE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          (cd deploy && ../kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ github.sha }})
          git config user.name "ci-bot"
          git config user.email "ci@dubnubdubnub"
          git add deploy/kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }} [skip ci]" || { echo "no deploy change"; exit 0; }
          # Token as a one-shot auth header (never in the remote URL, .git/config or argv of a
          # long-lived process), masked in case anything echoes it.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::${AUTH}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin HEAD:refs/heads/feat/s3-streaming
